syntax = "proto3";

package user.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/pphaiaiai/backend-challenge/gen/user/v1;userv1";

// UserService manages users. Every method requires the metadata
// "authorization: Bearer <token>", where the token comes from the REST login
// endpoint.
service UserService {
  // CreateUser creates a user.
  // Errors: INVALID_ARGUMENT, ALREADY_EXISTS, UNAUTHENTICATED.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // GetUser returns a user by ID.
  // Errors: NOT_FOUND, UNAUTHENTICATED.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 4;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}
